<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick API Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .test-result { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
    .success { background-color: #d4edda; border-color: #c3e6cb; }
    .error { background-color: #f8d7da; border-color: #f5c6cb; }
    .image-test { max-width: 200px; height: 150px; border: 1px solid #ccc; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow: auto; max-height: 200px; }
  </style>
</head>
<body>
  <h1>Quick API Test</h1>
  <button onclick="testAPI()">Test Hotel API</button>
  <div id="results"></div>

  <script>
    async function testAPI() {
      const results = document.getElementById('results');
      results.innerHTML = '<p>Testing...</p>';

      try {
        // Test 1: Basic connectivity
        console.log('🔍 Testing API connectivity...');
        const response = await fetch('http://localhost:8000/api/hotels/search?limit=1');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log('📦 Raw API response:', data);

        results.innerHTML = '';

        // Test 2: Check response structure
        const testDiv = document.createElement('div');
        testDiv.className = 'test-result success';
        testDiv.innerHTML = `
          <h3>✅ API Connection Successful</h3>
          <p><strong>Hotels found:</strong> ${data.hotels?.length || 0}</p>
          <p><strong>Response keys:</strong> ${Object.keys(data).join(', ')}</p>
        `;
        results.appendChild(testDiv);

        // Test 3: Examine first hotel
        if (data.hotels && data.hotels.length > 0) {
          const hotel = data.hotels[0];
          console.log('🏨 First hotel data:', hotel);

          const hotelDiv = document.createElement('div');
          hotelDiv.className = 'test-result';
          
          let imageStatus = '❌ No image';
          let imageInfo = 'No image data found';
          let testImageUrl = 'https://via.placeholder.com/200x150?text=No+Image';

          // Check image data
          if (hotel.image) {
            console.log('🖼️ Image data found:', hotel.image);
            console.log('🖼️ Image type:', typeof hotel.image);
            
            if (typeof hotel.image === 'string' && hotel.image.startsWith('data:')) {
              imageStatus = '✅ Data URL';
              imageInfo = `Data URL (${hotel.image.length} chars)`;
              testImageUrl = hotel.image;
            } else if (hotel.image.$binary && hotel.image.$binary.base64) {
              imageStatus = '⚠️ Raw MongoDB Format';
              imageInfo = `$binary.base64 (${hotel.image.$binary.base64.length} chars)`;
              testImageUrl = `data:image/jpeg;base64,${hotel.image.$binary.base64}`;
            } else {
              imageStatus = '⚠️ Unknown Format';
              imageInfo = `Type: ${typeof hotel.image}, Keys: ${Object.keys(hotel.image || {}).join(', ')}`;
            }
          }

          hotelDiv.innerHTML = `
            <h3>🏨 First Hotel Analysis</h3>
            <p><strong>Name:</strong> ${hotel.hotel_details?.hotel_name || 'Unknown'}</p>
            <p><strong>Image Status:</strong> ${imageStatus}</p>
            <p><strong>Image Info:</strong> ${imageInfo}</p>
            <img src="${testImageUrl}" class="image-test" alt="Test Image" 
                 onload="console.log('✅ Image loaded successfully')" 
                 onerror="console.log('❌ Image failed to load')" />
            <details>
              <summary>Raw Hotel Object</summary>
              <pre>${JSON.stringify(hotel, null, 2)}</pre>
            </details>
          `;
          results.appendChild(hotelDiv);
        }

      } catch (error) {
        console.error('💥 API test failed:', error);
        
        const errorDiv = document.createElement('div');
        errorDiv.className = 'test-result error';
        errorDiv.innerHTML = `
          <h3>❌ API Test Failed</h3>
          <p><strong>Error:</strong> ${error.message}</p>
          <p><strong>Possible Issues:</strong></p>
          <ul>
            <li>Backend server is not running</li>
            <li>Backend is not running on port 5000</li>
            <li>CORS configuration issue</li>
            <li>Network connectivity problem</li>
          </ul>
          <p><strong>Solutions:</strong></p>
          <ol>
            <li>Make sure your backend is running: <code>npm start</code> in the backend folder</li>
            <li>Check if <code>http://localhost:8000</code> is accessible in your browser</li>
          </ol>
        `;
        results.appendChild(errorDiv);
      }
    }

    // Auto-run test on page load
    window.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Quick API Test Ready');
      console.log('Click "Test Hotel API" button to run diagnostics');
    });
  </script>
</body>
</html>

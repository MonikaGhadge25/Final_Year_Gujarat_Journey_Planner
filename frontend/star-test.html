<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating Direction Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .test-container {
            margin: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .star-rating {
            direction: ltr !important;
            display: inline-flex !important;
            align-items: center;
            gap: 1px;
        }
        
        .star-rating i {
            display: inline-block !important;
            direction: ltr !important;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Star Rating Direction Tests</h2>
    
    <div class="test-container">
        <h4>Test 1: Basic Stars (should be left to right)</h4>
        <div class="star-rating">
            <i class="bi bi-star-fill" style="color: #ffc107;"></i>
            <i class="bi bi-star-fill" style="color: #ffc107;"></i>
            <i class="bi bi-star-fill" style="color: #ffc107;"></i>
            <i class="bi bi-star" style="color: #ddd;"></i>
            <i class="bi bi-star" style="color: #ddd;"></i>
        </div>
        <span style="margin-left: 10px;">(3.0)</span>
    </div>
    
    <div class="test-container">
        <h4>Test 2: Generated Stars</h4>
        <div id="generatedStars1"></div>
    </div>
    
    <div class="test-container">
        <h4>Test 3: Different Ratings</h4>
        <div id="testRatings"></div>
    </div>
    
    <div class="test-container">
        <h4>Test 4: Agent Card Simulation</h4>
        <div style="background: #f8f9fa; padding: 10px; border-radius: 5px;">
            <p><strong>Agent Name:</strong> John Doe</p>
            <p><strong>Rating:</strong> <span id="agentRating"></span></p>
        </div>
    </div>
</div>

<script>
function generateStarRating(rating) {
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 >= 0.5;
    const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
    
    let starsArray = [];
    
    // Add full stars first (left side)
    for (let i = 0; i < fullStars; i++) {
        starsArray.push('<i class="bi bi-star-fill" style="color: #ffc107; display: inline-block;"></i>');
    }
    
    // Add half star if needed (middle)
    if (hasHalfStar) {
        starsArray.push('<i class="bi bi-star-half" style="color: #ffc107; display: inline-block;"></i>');
    }
    
    // Add empty stars last (right side)
    for (let i = 0; i < emptyStars; i++) {
        starsArray.push('<i class="bi bi-star" style="color: #ddd; display: inline-block;"></i>');
    }
    
    return `<span class="star-rating">${starsArray.join('')}</span>`;
}

document.addEventListener('DOMContentLoaded', () => {
    // Test 2: Generated stars
    document.getElementById('generatedStars1').innerHTML = 
        generateStarRating(4.2) + ' <span style="margin-left: 8px; color: #666;">(4.2)</span>';
    
    // Test 3: Different ratings
    const testRatings = [5.0, 4.5, 3.8, 2.1, 0.5, 0.0];
    let ratingsHtml = '';
    testRatings.forEach(rating => {
        ratingsHtml += `<div style="margin: 5px 0;">
            ${rating.toFixed(1)}: ${generateStarRating(rating)} (${rating.toFixed(1)})
        </div>`;
    });
    document.getElementById('testRatings').innerHTML = ratingsHtml;
    
    // Test 4: Agent simulation
    const agentRating = 3.7;
    const ratingDisplay = agentRating > 0 
        ? `<span class="star-rating">${generateStarRating(agentRating).replace('<span class="star-rating">', '').replace('</span>', '')}</span> <span style="color: #666; font-size: 14px; margin-left: 8px;">(${agentRating.toFixed(1)})</span>`
        : '<span style="color: #999; font-style: italic;">No ratings yet</span>';
    document.getElementById('agentRating').innerHTML = ratingDisplay;
});
</script>

</body>
</html>
